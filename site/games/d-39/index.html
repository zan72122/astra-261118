<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#657774"><title>長靴で水たまりをふむ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,main{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#88958b}
main{position:relative;touch-action:none;isolation:isolate;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 49% 44%,transparent 44%,#1c302a21 100%);}
#chapter,#sound{position:absolute;top:max(19px,env(safe-area-inset-top));color:#faf7e9;background:linear-gradient(140deg,#45575194,#26383298);border:1px solid #fff7;box-shadow:0 2px 9px #162c2920,inset 0 0 0 2px #faf4df0b;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#chapter{left:max(19px,env(safe-area-inset-left));height:37px;border-radius:22px;padding:0 14px 0 11px;display:flex;align-items:center;gap:6px;pointer-events:none}
#chapter svg{width:23px;height:23px;margin-right:3px}
#chapter i{display:block;width:5px;height:5px;border-radius:50%;background:#e8e7d356}
#chapter i.on{background:#ffe6a7;box-shadow:0 0 6px #ffdda17a}
#sound{right:max(19px,env(safe-area-inset-right));width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:10px}
#sound svg{width:21px;height:21px;overflow:visible}
#hand{position:absolute;left:0;top:0;width:40px;height:49px;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 4px #1f322a65);will-change:transform,opacity}
</style>
</head><body><main id="play"><canvas id="lane" aria-label="赤い長靴と水たまり"></canvas><div id="finish"></div>
<div id="chapter" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><g id="weather"></g></svg><i class="on"></i><i></i><i></i><i></i></div>
<button id="sound" aria-label="音を切り替える" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9h4l5-4.4v14.8l-5-4.4h-4z" fill="currentColor" stroke-width=".5"/><path id="soundwave" d="M16 8.4a5.3 5.3 0 0 1 0 7.2m3-10.1a9.2 9.2 0 0 1 0 13"/></svg></button>
<svg id="hand" viewBox="0 0 44 54" aria-hidden="true"><path d="M12 29V7c0-5 6-5 6 0v16-6c0-5 6-5 6 0v7-4c0-4 6-4 6 0v6-2c0-4 6-4 6 0v10c0 5-3 8-5 13H18c-1-4-6-7-8-11L4 26c-2-4 2-6 5-3z" fill="#fff9e9" fill-opacity=".83" stroke="#665f49" stroke-opacity=".7" stroke-width="1.5"/></svg>
</main><script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="audio.js"></script><script src="models.js"></script><script src="street.js"></script><script src="game.js"></script></body></html>
