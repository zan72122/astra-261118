<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a443e"><title>石で水面をとばす</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#666f72}body{touch-action:none;user-select:none;-webkit-user-select:none}#lake,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}#lake{touch-action:none}#overlay{pointer-events:none}
#sound{position:absolute;top:max(19px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));width:44px;height:44px;border:1px solid #fff2d773;border-radius:50%;background:#343b3587;box-shadow:0 2px 14px #26333329,inset 0 0 0 3px #242b2914;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}#sound:active{transform:scale(.95)}#route{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:245px;height:51px;border-radius:30px;border:1px solid #e4d2ad65;background:linear-gradient(180deg,#343f3be6,#242d2be0);box-shadow:0 5px 19px #161d2240,inset 0 0 0 3px #eff1cf08;backdrop-filter:blur(12px);pointer-events:none}#route canvas{width:100%;height:100%}@media(max-width:500px){#route{width:216px;height:47px;bottom:max(19px,env(safe-area-inset-bottom))}#sound{right:16px;top:max(16px,env(safe-area-inset-top))}}
</style></head><body>
<canvas id="lake" aria-label="夕方の湖で石をはじく遊び"></canvas><canvas id="overlay" aria-hidden="true"></canvas>
<div id="route" role="img" aria-label="岸の石から木陰までの道"><canvas width="490" height="102"></canvas></div>
<button id="sound" aria-label="音の切り替え" aria-pressed="true"><canvas width="54" height="54" style="width:27px;height:27px"></canvas></button>
<script src="vendor/three.min.js"></script><script src="lake.js"></script><script src="landscape.js"></script><script src="game.js"></script>
</body></html>
