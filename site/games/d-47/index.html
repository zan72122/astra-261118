<html lang="ja"><head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#c2c2a4;touch-action:none;user-select:none}canvas{width:100%;height:100%;display:block;touch-action:none}#audio{position:fixed;right:max(22px,env(safe-area-inset-right));top:max(21px,env(safe-area-inset-top));width:45px;height:45px;border:1px solid #fff9;border-radius:50%;background:#f8f4e5d9;color:#4a514a;box-shadow:0 3px 14px #192f3619;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(9px)}#audio svg{width:22px;height:22px}svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}#audio .muted,#audio.off .on{display:none}#audio.off .muted{display:block}
#journey{pointer-events:none;position:fixed;bottom:max(23px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #fff9;border-radius:35px;background:#f8f4e6e6;box-shadow:0 4px 20px #25312b26;backdrop-filter:blur(12px)}#journey i{display:block;width:10px;height:1px;background:#a7ae9f}#journey span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#899183;transition:color .6s,background .6s}#journey span.active{background:#3e5557;color:#fff9e2}#journey span.done{color:#4b6864}#journey svg{width:23px;height:23px}
