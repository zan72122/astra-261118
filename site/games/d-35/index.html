<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#c6ae87"><title>ボタンのびん</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfb996;touch-action:none;user-select:none;-webkit-user-select:none}#room{width:100%;height:100%;height:100dvh;display:block;outline:0;touch-action:none}#finish{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 47% 43%,transparent 44%,rgba(69,48,32,.13) 112%)}#chapters{position:fixed;left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));width:120px;height:42px;pointer-events:none;filter:drop-shadow(0 2px 3px #4b402e34)}#sound{position:fixed;right:max(22px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));width:46px;height:46px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;filter:drop-shadow(0 2px 3px #52423045)}#sound:focus-visible{outline:2px solid #4e7772;outline-offset:3px}#sound canvas{width:100%;height:100%}#guide{position:fixed;width:56px;height:66px;left:0;top:0;pointer-events:none;opacity:0;filter:drop-shadow(1px 2px 2px #513e3652)}@media(max-width:600px){#chapters{left:13px;top:max(13px,env(safe-area-inset-top));width:102px;height:36px}#sound{right:13px;top:max(11px,env(safe-area-inset-top));width:42px;height:42px}}
</style></head><body>
<canvas id="room" aria-label="窓辺のボタンとガラス瓶"></canvas>
<div id="finish"></div><canvas id="chapters" width="360" height="126" aria-hidden="true"></canvas>
<button id="sound" aria-label="音を消す" aria-pressed="false"><canvas width="138" height="138"></canvas></button>
<canvas id="guide" width="168" height="198" aria-hidden="true"></canvas>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="craft.js"></script><script src="room.js"></script><script src="audio.js"></script><script src="play.js"></script>
</body></html>
