<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#535747">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>落ち葉をかき集める</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,main{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#a8a78d;touch-action:none;user-select:none;-webkit-user-select:none}
main{position:fixed;inset:0;isolation:isolate}
#garden{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
#garden:active{cursor:grabbing}
.hud{position:absolute;top:max(24px,env(safe-area-inset-top));left:max(27px,env(safe-area-inset-left));right:max(27px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;color:#f1ead5}
.chapters,.sound{border:1px solid #ede1bd63;background:linear-gradient(125deg,#494b3ae8,#373e33c7);box-shadow:inset 0 1px 0 #ffffe222,0 3px 16px #201a1329;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chapters{display:flex;align-items:center;gap:7px;border-radius:30px;height:52px;padding:5px 12px 5px 5px}
.chapters i{width:3px;height:3px;border-radius:50%;background:#d1cbb05c;box-shadow:0 1px 1px #292a20}
.chapter{display:grid;place-items:center;width:31px;height:36px;position:relative;color:#dfdbc3a6;transition:color .6s}
.chapter svg{width:22px;height:22px;filter:drop-shadow(0 1px 0 #272b2377)}
.chapter.current{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#fff3ce,#dfc898);box-shadow:inset 0 0 0 1px #fff0cb, inset 0 0 0 3px #dbc69b,0 1px 5px #24251a50;color:#7c603d}
.chapter.current svg{width:24px;height:24px;filter:none}
.chapter.done{color:#e5d4a8}
.sound{appearance:none;width:47px;height:47px;border-radius:50%;display:grid;place-items:center;color:#f5efd9;pointer-events:auto;cursor:pointer;padding:11px}
.sound:active{transform:scale(.95)}.sound svg{width:23px;height:23px}.mutemark{display:none}.sound.muted .waves{display:none}.sound.muted .mutemark{display:block}
#hint{position:absolute;left:0;top:0;width:57px;height:65px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 4px #372d1b88);transform-origin:13px 7px;will-change:transform,opacity}
.defs{position:absolute;width:0;height:0;overflow:hidden}
@media(max-width:600px){.hud{top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right))}.chapters{height:45px;gap:4px;padding:4px 9px 4px 4px}.chapter{width:26px;height:31px}.chapter.current{width:35px;height:35px}.chapter svg{width:20px;height:20px}.chapter.current svg{width:22px;height:22px}.sound{width:42px;height:42px;padding:9px}}
</style>
</head>
<body>
<main>
<canvas id="garden" aria-label="秋の庭で落ち葉を集める遊び"></canvas>
<svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<symbol id="maple" viewBox="0 0 32 32"><path fill="currentColor" d="m16 1.4 2.3 5.9 2.1-1.5-.9 7.2 4.3-4.3.8 2.8 4.6-1.2-1.7 5 2.2.8-6.9 5.9.9 2.2-6.8-.7.2 6.4-1.9.1.2-6.5-6.8.7.9-2.2-6.9-5.9 2.2-.8-1.7-5 4.6 1.2.8-2.8 4.3 4.3-.9-7.2 2.1 1.5z"/></symbol>
<symbol id="acorn" viewBox="0 0 32 32"><g transform="rotate(28 16 16)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15c.1 6.8 3.5 10.4 8.7 13 5.4-2.7 8.8-6.2 9.2-13z" fill="currentColor" stroke="none"/><path d="M5.4 13.7c.2-5.1 4.4-8.1 10.5-8.1s10.4 3.2 10.7 8.1c-7.6 1.2-13.6 1.2-21.2 0Z" fill="none" stroke-width="2"/><path d="M16.4 5.4c-.4-2.1 1.2-3.6 3.2-4.2" fill="none" stroke-width="2.6"/><path d="m10.5 10.9 1.2-.7m4.2-.5 1.2-.6m4.2 1.6 1-.5" stroke-width="1.5"/></g></symbol>
<symbol id="wind" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M3 12.3h13.2c5.6 0 5.6-7.7 1-7.7-2 0-3.2 1.1-3.5 2.7M1.8 17.1h22.6c6.3 0 6-8.7 1-8.4M7.5 21.8h10.4c4.9 0 5.1 6.4.9 6.4-1.5 0-2.7-.6-3.1-1.8"/></g></symbol>
<symbol id="hut" viewBox="0 0 32 32"><g stroke="currentColor" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2"><path d="m2.4 14 13.7-11L29.6 14M5.8 12.3v15.4h20.4V12.3M11 27V14.6h10V27M11.8 25.7l8.5-9.9M14.3 9.4h3.5"/></g></symbol>
</svg>
<div class="hud">
<div class="chapters" role="img" aria-label="秋の庭の四つの場面">
<span class="chapter current"><svg><use href="#maple"/></svg></span><i></i>
<span class="chapter"><svg><use href="#acorn"/></svg></span><i></i>
<span class="chapter"><svg><use href="#wind"/></svg></span><i></i>
<span class="chapter"><svg><use href="#hut"/></svg></span>
</div>
<button class="sound" aria-label="音の切り替え" aria-pressed="true">
<svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M4.3 10.7h4.2l5.5-4.4v15.4l-5.5-4.4H4.3z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><g stroke="currentColor" stroke-linecap="round" stroke-width="1.8"><g class="waves"><path d="M17.8 9.5a6.6 6.6 0 0 1 0 9M21.4 6.4a10.6 10.6 0 0 1 0 15.2"/></g><path class="mutemark" d="m18.8 11.2 5 5m0-5-5 5"/></g></svg>
</button>
</div>
<svg id="hint" viewBox="0 0 57 65" aria-hidden="true"><circle cx="12" cy="9" r="7.2" fill="none" stroke="#fcf0cf" stroke-width="1.3" opacity=".7"/><path d="M12.3 8.2c-2.6.7-3 3.3-2.3 6.3l3.8 16.1-4-3.7c-4.6-4.1-8.4.3-5.1 5.2l9.4 14.1c4.5 6 7.7 6.4 10.8 12.1l19.4-5c-.6-5.8 1.2-11.1.1-17.3l-2-10.4c-.9-5-6.8-4.8-7.1.4l-1.2-5.1c-1.3-5.4-7.4-4.3-7.3 1.1l-.9-4.2c-1.1-5.3-7.1-4-6.9 1.2L17.1 12c-.7-3-2.2-4.5-4.8-3.8z" fill="#fff6df" fill-opacity=".86" stroke="#6c6148" stroke-opacity=".65" stroke-width="1.5" stroke-linejoin="round"/></svg>
</main>
<script src="vendor/three.min.js"></script>
<script src="garden.js"></script>
<script src="materials.js"></script>
<script src="world.js"></script>
<script src="audio.js"></script>
<script src="play.js"></script>
</body>
</html>
