<head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ddd0ae"><title>デパートのエスカレーター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,main{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:#dacfaf;user-select:none;-webkit-user-select:none}#view{display:block;width:100%;height:100%;touch-action:none}#nav{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));display:flex;align-items:center;gap:9px;padding:6px 12px;border:1px solid #a18d62;border-radius:30px;background:linear-gradient(176deg,#fff8e8f2,#e5dfcaee);box-shadow:inset 0 0 0 2px #f9f3e1,0 3px 10px #38291728;pointer-events:none}svg{display:block}.stop{width:28px;height:28px;color:#898c7d;display:grid;place-content:center;border-radius:50%;transition:background .6s,color .6s}.stop.on{background:#365e50;color:#fff2c5;box-shadow:0 0 0 1px #c4a363,inset 0 0 0 2px #456d5c}.stop svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linejoin:round;stroke-linecap:round}.pin{width:3px;height:3px;background:#b1a17d;transform:rotate(45deg)}#sound{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));width:41px;height:41px;border:1px solid #ac9770;border-radius:50%;display:grid;place-content:center;background:linear-gradient(#fcf6e8f5,#dfd7beed);box-shadow:inset 0 0 0 2px #f3eddb,0 3px 9px #392c2024;color:#486356;touch-action:manipulation}#sound svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#sound .mute{display:none}#sound.off .waves{display:none}#sound.off .mute{display:block}
#hand{position:absolute;pointer-events:none;left:0;top:0;width:48px;height:60px;opacity:0;filter:drop-shadow(0 3px 3px #26382a66);transform-origin:7px 4px}#hand svg{width:100%;height:100%}
@media(max-width:500px){#nav{left:14px;gap:6px;padding:5px 9px}#sound{right:14px}}
</style></head><body><main><canvas id="view" aria-label="百貨店のエスカレーター"></canvas>
