<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b4c9d6">
<title>グライダーで気球のあいだを</title>
<style>
*{box-sizing:border-box}html,body,main{width:100%;height:100%;margin:0;overflow:hidden}body{background:#c8d6df;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}main{position:relative;isolation:isolate}canvas{width:100%;height:100%;display:block;touch-action:none}
#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 48%,rgba(58,67,79,.105));z-index:1}
.glass{border:1px solid rgba(255,255,255,.53);background:linear-gradient(155deg,rgba(41,62,69,.56),rgba(52,67,68,.34));box-shadow:inset 0 1px 0 #ffffff22,0 3px 16px #293f4c17;backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
#route{position:absolute;top:max(23px,env(safe-area-inset-top));left:max(25px,env(safe-area-inset-left));display:flex;height:43px;align-items:center;gap:9px;padding:0 12px;border-radius:26px;z-index:2;pointer-events:none;color:#f1f1e8}
.stop{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;opacity:.7;transition:background .8s,opacity .8s,color .8s}
.stop.active{background:#ffdfb5;color:#604e43;opacity:1;box-shadow:0 0 8px #ffd9a03a}.stop svg{width:21px;height:21px;overflow:visible}.link{height:1px;width:10px;background:#fff8}
button{cursor:pointer;color:#fff9eb;padding:0;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;position:absolute;right:max(25px,env(safe-area-inset-right));top:max(23px,env(safe-area-inset-top));z-index:3}button svg{width:22px;height:22px}
#sound .off{display:none}#sound.mute .on{display:none}#sound.mute .off{display:block}button:focus-visible{outline:3px solid #ffe1b4}
#dial{position:absolute;right:max(27px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;pointer-events:none;z-index:2;color:#fff5df}#dial svg{width:100%;height:100%}
#hint{position:absolute;width:36px;height:46px;pointer-events:none;z-index:2;opacity:0;filter:drop-shadow(0 2px 3px #303e5155);transform-origin:8px 5px}
#veil{position:absolute;inset:0;pointer-events:none;background:#f5e8d6;opacity:0;z-index:5}
@media(max-width:540px){#route{left:16px;top:max(17px,env(safe-area-inset-top));height:37px;gap:5px;padding:0 8px}.stop{width:25px;height:25px}.link{width:7px}button{right:16px;top:max(17px,env(safe-area-inset-top));width:37px;height:37px}#dial{width:51px;height:51px;right:17px;bottom:max(19px,env(safe-area-inset-bottom))}}
</style>
</head>
<body><main>
<canvas id="view" aria-label="高原から海までのグライダー飛行"></canvas><div id="finish"></div>
<div id="route" class="glass" aria-hidden="true">
<span class="stop active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"><path d="M12 2.5c-8.5 0-9 8.1-3 14.1h6c6-6 5.5-14.1-3-14.1Z"/><path d="M12 2.5c-3.8 2.7-4.4 8.1-1.2 14m1.2-14c3.8 2.7 4.4 8.1 1.2 14M9.7 17l.8 3.8h3l.8-3.8"/></svg></span><i class="link"></i>
<span class="stop"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" fill="none"><path d="m1.8 18.5 7-11 3.5 5.4L16.6 5 23 18.5Zm4.5-7 2.4 1.3 1.8-2.5m3.9-1.6 2.4 1.6 1.6-1.8"/></svg></span><i class="link"></i>
<span class="stop"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-width="1.45" fill="none"><path d="M4 18h15a3 3 0 0 0 .2-6A5.7 5.7 0 0 0 8 11.7 3.3 3.3 0 0 0 4 18Z"/><path d="M14.5 7a3.5 3.5 0 0 1 6 3M18 2v1.5m4.2 1.1-1 1.2"/></svg></span><i class="link"></i>
<span class="stop"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.45" fill="none"><path d="m3 13 6.8-6 6.8 6m-11.8-1v7h10v-7m2.8-3 2-4 1.7 4m-3.1 1.5-.5 6.3m-15 4q2-1.6 4 0t4 0 4 0 4 0 4 0"/></svg></span>
</div>
<button type="button" id="sound" class="glass" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.55"><path d="M3.5 9.4h4l5-4v13.2l-5-4h-4Z"/><g class="on"><path d="M16 8.4a5.1 5.1 0 0 1 0 7.2m2.6-10a9 9 0 0 1 0 12.8"/></g><path class="off" d="m16.2 9 5 6m0-6-5 6"/></svg></button>
<div id="dial" class="glass" aria-hidden="true"><svg viewBox="0 0 66 66" fill="none"><g stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path opacity=".6" d="M12 38a22 22 0 1 1 42 0" stroke-dasharray="1 4.5"/><path d="M33 9v4m-17.5 3.6 2.8 2.7m32.2-2.7-2.8 2.7"/><g id="attitude"><path d="m11 37 16-2.8 5-1.1 1-4.8 1 4.8 5 1.1L55 37l-16-.1-4.5.7-1.5 2-1.5-2-4.5-.7Z" fill="currentColor" stroke-width=".5"/></g><path d="M25 48h16m-12 3h8" opacity=".7"/></g></svg></div>
<svg id="hint" viewBox="0 0 37 46" aria-hidden="true"><g fill="none" stroke="#fff6da" opacity=".82"><circle cx="8" cy="8" r="6.8"/><circle cx="8" cy="8" r="4.2"/></g><path d="M10 25 5.7 9.3c-.9-3.6 3.3-4.5 4.5-1.2l4.2 11.8-.8-3.5c-.6-2.7 3.2-3.5 4.2-1.1l1.5 3.5c-1.2-4.4 2.4-4.9 3.8-2.6l1.8 3.6c-.6-3.5 2.5-3.9 3.8-1.3l3.2 7.8c1.1 3 .6 5.9-.7 8.2l-1 3.4L20 41c-1.1-3.1-4.5-4-7-6.4L4 26c-2.2-2.3.7-5.1 3-3.4Z" stroke="#877768" stroke-width=".85" fill="#fff4df"/></svg>
<div id="veil"></div></main>
<script src="vendor/three.min.js"></script><script src="world.js"></script><script src="scenery.js"></script><script src="aircraft.js"></script><script src="sound.js"></script><script src="flight.js"></script>
</body></html>
