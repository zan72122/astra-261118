<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#aac8c5">
<title>しゃぼん玉の午後</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#bad6da}body{touch-action:none;user-select:none;-webkit-user-select:none}
#garden{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sound{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(19px,env(safe-area-inset-top));width:43px;height:43px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff9;color:#fffff7;background:rgba(53,72,58,.31);backdrop-filter:blur(9px);box-shadow:0 2px 10px #1f38241c;cursor:pointer}
#sound svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}#sound .off,#sound.muted .on{display:none}#sound.muted .off{display:block}
#chapters{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid #fff6;border-radius:27px;background:#36483c55;backdrop-filter:blur(12px);box-shadow:0 2px 12px #22382319;pointer-events:none}
#chapters svg{display:block;padding:5px;width:29px;height:29px;color:#fff9;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:background .8s,color .8s;border-radius:50%}#chapters svg.here{background:#fff5dbe8;color:#6c7059}
#guide{position:fixed;width:42px;height:48px;left:0;top:0;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px #4d554a4d)}
</style>
</head>
<body>
<canvas id="garden" aria-label="しゃぼん玉の庭"></canvas>
<button id="sound" type="button" aria-label="音を消す" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3.5 9h4l5-4v14l-5-4h-4z"/><g class="on"><path d="M16 8.5c2 2 2 5 0 7M18.8 5.8c3.7 3.5 3.7 8.9 0 12.4"/></g><path class="off" d="m16.5 9 5 6m0-6-5 6"/></svg></button>
<div id="chapters" aria-hidden="true">
<svg class="here" viewBox="0 0 24 24"><circle cx="13.5" cy="8.4" r="5.4"/><path d="m10.3 13-5.6 8M11 6.8c.7-1.1 1.5-1.5 2.6-1.6"/></svg>
<svg viewBox="0 0 24 24"><path d="M3 8.5h12c4.7 0 4.7-6.2.8-6.2-1.5 0-2.3.9-2.6 1.9M2 12h16c4.3 0 4.7 5.6 1.2 5.6M5.5 16h5.8c3.7 0 3.5 5.2.3 5.2"/></svg>
<svg viewBox="0 0 24 24"><path d="M2.5 15.5h19c-.8 3.3-4.7 4.3-9.5 4.3s-8.7-1-9.5-4.3ZM12 13.5V4m-2.2 4.6C6.3 2 3.3 6.8 4.4 9.6m9.7-1.2c3.9-6.2 6.9-1.6 5.8 1.2"/></svg>
<svg viewBox="0 0 24 24"><path d="M2 16h20M6.5 15.8a5.5 5.5 0 0 1 11 0M12 3.5v3m-8 0 2.4 2.4m13.6-2.4-2.4 2.4M6 20h12"/></svg>
</div>
<svg id="guide" viewBox="0 0 44 50" aria-hidden="true"><path d="M12 27 9 12c-.8-4.8 4.7-6 6-1.6l3.5 12.2-1-4.1c-.6-3.1 3.8-4.7 5.3-1.2l1.7 4.5-1-3c-.5-2.9 3.8-4 5.1-.8l1.4 3.9-.6-2.4c0-2.7 3.4-3.1 4.7-.3 2.8 6.9 5.1 11.4 3.1 16.9l-2.5 6.3-14.6 3.5c-2.7-5.5-8.8-7.1-13.3-13.9-2.1-3 1.6-6.2 4.1-3.8l5.2 4.4z" fill="#fffbef" stroke="#fff" stroke-width="1.6"/></svg>
<script src="vendor/three.min.js"></script>
<script src="simulation.js"></script>
<script src="materials.js"></script>
<script src="garden.js"></script>
<script src="game.js"></script>
</body>
</html>
