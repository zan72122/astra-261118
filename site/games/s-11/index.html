<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#becac4"><title>ふわり チーズのおやま</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#c4b69c;overscroll-behavior:none}#world{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#world:active{cursor:grabbing}
#finish{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 43%,transparent 49%,rgba(54,35,22,.105) 100%);box-shadow:inset 0 0 60px #7654270c}
#sound{position:fixed;right:max(22px,env(safe-area-inset-right));top:max(21px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#fff9e8,#e6ddc6);border:1px solid #b99c79;box-shadow:0 2px 6px #382b2233,inset 0 0 0 3px #f9f2de,inset 0 0 0 4px #c8b798;display:grid;place-items:center;color:#615747;cursor:pointer;touch-action:manipulation}#sound canvas{width:26px;height:26px}
#steps{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:248px;height:62px;pointer-events:none;background:linear-gradient(170deg,#fffbed,#eee3ce);border:1px solid #b69a74;border-radius:34px;box-shadow:0 4px 14px #42271338,inset 0 0 0 3px #fbf5e4,inset 0 0 0 4px #cbb99a;}#steps canvas{width:100%;height:100%;display:block}@media(max-width:520px){#steps{width:224px;height:56px;bottom:max(17px,env(safe-area-inset-bottom))}#sound{right:16px;top:max(16px,env(safe-area-inset-top));width:42px;height:42px}}
</style></head><body><canvas id="world" aria-label="お菓子づくりの台"></canvas><div id="finish"></div><div id="steps" aria-hidden="true"><canvas width="496" height="124"></canvas></div><button id="sound" aria-label="音を消す" aria-pressed="false"><canvas width="60" height="60"></canvas></button>
<script src="vendor/three.min.js"></script><script src="sim.js"></script><script src="studio.js"></script><script src="kitchen.js"></script><script src="audio.js"></script><script src="play.js"></script></body></html>
