<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fa996">
<title>すなばでトンネルほり</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,main{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#c2c8ae;font-family:system-ui;user-select:none;-webkit-user-select:none}
main{position:relative;isolation:isolate}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}
#sound{position:absolute;top:max(20px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));width:48px;height:48px;border:1px solid #fff9;background:linear-gradient(145deg,#fffcf2f7,#f4eddbf2);box-shadow:0 3px 12px #2b392521,inset 0 -2px 1px #b9b09660;color:#435a50;border-radius:50%;padding:11px;cursor:pointer;touch-action:manipulation}
#sound svg{width:100%;height:100%}#sound .mute{display:none}#sound.off .mute{display:block}#sound.off .waves{display:none}
#steps{position:absolute;bottom:max(21px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:11px;padding:7px 11px;background:linear-gradient(165deg,#fffdf2f5,#ede7d7f5);border:1px solid #fffaf1c9;border-radius:40px;box-shadow:0 4px 15px #292a2428,inset 0 -2px 2px #ac9f8060;pointer-events:none}
.glyph{display:grid;place-items:center;width:39px;height:39px;border-radius:50%;color:#8b8a76;transition:color .5s,background .5s;position:relative}
.glyph:not(:last-child):after{content:"";position:absolute;right:-7px;width:3px;height:3px;border-radius:50%;background:#b5ad97}
.glyph.on{color:#fff8e6;background:#54786c;box-shadow:inset 0 1px 4px #324a3e59,0 1px 0 #fff}
.glyph svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round}
#guide{position:absolute;left:0;top:0;width:39px;height:47px;pointer-events:none;opacity:0;filter:drop-shadow(0 3px 3px #56472f4d);will-change:transform,opacity}
@media(max-width:600px){#sound{width:43px;height:43px;right:15px;top:max(15px,env(safe-area-inset-top))}#steps{gap:8px;padding:5px 9px}.glyph{width:34px;height:34px}.glyph svg{width:25px;height:25px}.glyph:not(:last-child):after{right:-6px}}
</style>
</head>
<body>
<main>
<canvas id="park" aria-label="砂の山と公園の砂遊び道具"></canvas>
<button id="sound" aria-label="音を切る" aria-pressed="true">
<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" stroke-width=".5" d="M4 10.7h4.2l6.9-5.6v17.8l-6.9-5.6H4z"/><g class="waves"><path d="M19 9.7a6 6 0 0 1 0 8.6M22.3 6.7a10.1 10.1 0 0 1 0 14.6"/></g><path class="mute" d="m19.2 11 5.4 6m0-6-5.4 6"/></svg>
</button>
<div id="steps" aria-hidden="true">
<span class="glyph on"><svg viewBox="0 0 32 32"><path d="M3.2 25.5h25.7M5 25l5.4-5.9 3-3.6q2.4-3.1 4.7.4L26 25"/><path d="m8.6 12 1.1-2.1m3.1.4.3-2M16 9l1-1.5m-1.7 11.9 1.2-.3M11 22l1.2-.4"/></svg></span>
<span class="glyph"><svg viewBox="0 0 32 32"><path d="M16 3.8c-1.6 4.3-8.1 11.1-8.1 16.3a8.1 8.1 0 1 0 16.2 0C24.1 14.9 17.7 8.1 16 3.8Z"/><path d="M11.5 20a4.4 4.4 0 0 0 4 4.7"/></svg></span>
<span class="glyph"><svg viewBox="0 0 32 32"><path d="M2.7 23.6q13.3-12.5 26.6 0M3.5 27v-9.7m25 9.7v-9.7M4 18.2q12-11.6 24 0M9 14.6v5.3m7-7v5.2m7-3.5v5.3"/></svg></span>
<span class="glyph"><svg viewBox="0 0 32 32"><path d="M8 19.5a5.2 5.2 0 0 1-1-10.2 7 7 0 0 1 13.2-1.5 6 6 0 1 1 3.4 11.7Z"/><path d="m10 23.3-1.5 3.1m8.3-3.1-1.5 3.1m8.3-3.1-1.5 3.1"/></svg></span>
</div>
<svg id="guide" viewBox="0 0 40 48" aria-hidden="true"><path d="M9 27 4.6 11.7c-1.1-4.7 5.1-6.6 6.5-2l4.6 12.4-1.3-5.1c-.6-3.8 4.8-4.9 6.1-1.6l1.1 3.6c-.9-4 4.2-5.3 5.8-2.5l1.2 3.5c-.3-2.9 4.4-3.8 5.8-.3 3.6 8.8 2.2 12-.4 17.4L22 42.3c-4.7-1-7.1-4.8-10.6-6.9l-8.9-5.1c-3.4-2.4-.9-6.5 2.8-5.2z" fill="#fff8df" fill-opacity=".9" stroke="#7d7863" stroke-width="1.4"/></svg>
</main>
<script src="vendor/three.min.js"></script>
<script src="sand.js"></script>
<script src="sound.js"></script>
<script src="craft.js"></script>
<script src="park.js"></script>
<script src="game.js"></script>
</body>
</html>
