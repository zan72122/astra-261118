<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e1d3b8">
<title>ころころ装置</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ddc9a7;touch-action:none;overscroll-behavior:none}#world{position:fixed;inset:0;width:100%;height:100%;outline:0;display:block}#finish{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 51% 43%,transparent 46%,rgba(57,37,22,.115) 100%);box-shadow:inset 0 0 1px rgba(70,48,22,.18)}#chapters{position:fixed;left:max(22px,env(safe-area-inset-left));top:max(21px,env(safe-area-inset-top));height:52px;display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:22px;background:linear-gradient(170deg,#fff6df,#e7d5b2);border:1px solid #fff6e6;box-shadow:0 3px 1px #a88e67,0 5px 11px #49341935,inset 0 0 0 2px #e9d8bc;pointer-events:none}#chapters:before{content:"";position:absolute;top:50%;left:22px;right:22px;border-top:2px solid #bba47e}.bead{position:relative;width:31px;height:31px;border-radius:50%;background:#e6d8bb;box-shadow:inset 0 1.5px 2px #927e5855,0 1px 0 #fff5e1;display:grid;place-items:center}.bead svg{width:23px;height:23px;opacity:.45}.bead.current{background:#fff3cf;outline:2px solid #b97732;box-shadow:0 0 0 4px #fff3d7,inset 0 1px 3px #ad85565c}.bead.current svg,.bead.past svg{opacity:1}#sound{display:grid;place-items:center;position:fixed;top:max(22px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));width:46px;height:46px;padding:10px;border:1px solid #fff5df;border-radius:50%;color:#775838;background:linear-gradient(140deg,#fff8e7,#e5d0a9);box-shadow:0 3px 1px #a48a63,0 5px 11px #422c1a33,inset 0 0 0 2px #ecdab9;cursor:pointer}#sound svg{width:25px;height:25px}#sound.off .waves,#sound:not(.off) .mute{display:none}#sound:active{transform:translateY(2px)}#finger{position:fixed;top:0;left:0;width:42px;height:52px;pointer-events:none;opacity:0;filter:drop-shadow(0 3px 3px #60462350);will-change:transform,opacity}@media(max-width:580px){#chapters{height:44px;gap:8px;padding:5px 10px;top:max(14px,env(safe-area-inset-top));left:14px}.bead{width:26px;height:26px}.bead svg{width:21px;height:21px}#sound{width:41px;height:41px;right:14px;top:max(15px,env(safe-area-inset-top));padding:7px}#finger{width:36px;height:46px}}
</style>
</head>
<body>
<canvas id="world" aria-label="ころころ装置の遊び場"></canvas>
<div id="finish"></div>
<div id="chapters" aria-hidden="true">
<span class="bead current"><svg viewBox="0 0 32 32"><g stroke="#775333" stroke-width="1.4" stroke-linejoin="round"><rect x="3.5" y="11" width="7" height="16" rx="1.6" fill="#d89439" transform="rotate(-9 7 25)"/><rect x="11" y="7" width="7" height="19" rx="1.5" fill="#3f888d" transform="rotate(-4 14 24)"/><rect x="20" y="4" width="8" height="22" rx="1.5" fill="#c15d43" transform="rotate(5 24 24)"/></g><g fill="#ffebc1"><circle cx="24.8" cy="9" r="1.3"/><circle cx="24.2" cy="18.5" r="1.3"/><circle cx="14" cy="12" r="1.2"/></g></svg></span>
<span class="bead"><svg viewBox="0 0 32 32"><path d="M15 4v19" stroke="#89603c" stroke-width="2"/><path d="M13 6 4 19h9z" fill="#d7a044"/><path d="m17 5 10 14H17z" fill="#ca694c"/><path d="M2.5 22h27l-5 5H7z" fill="#437e83"/></svg></span>
<span class="bead"><svg viewBox="0 0 32 32"><path d="m3 18 9-3 2-10 4-1 2 10 8-1q4 2 0 4l-9 2-3 9-3 1 0-9-7 1z" fill="#547f89" stroke="#8b795b" stroke-width="1"/></svg></span>
<span class="bead"><svg viewBox="0 0 32 32"><path d="M4 13 16 5l12 8z" fill="#bd644b"/><path d="m12 13 4-8 4 8" fill="#e7b75f"/><path d="M7 14v12m9-12v12m9-12v12" stroke="#a9844c" stroke-width="2"/><path d="M4 26h24v3H4z" fill="#55868a"/><circle cx="16" cy="4" r="2" fill="#c29843"/></svg></span>
</div>
<button id="sound" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"><path d="M4 11h5l6-5v16l-6-5H4z" fill="currentColor" stroke-linejoin="round"/><g class="waves"><path d="M19 9q5 5 0 10M22 5q8 9 0 18"/></g><path class="mute" d="m19 11 6 6m0-6-6 6"/></svg></button>
<svg id="finger" viewBox="0 0 43 55" aria-hidden="true"><path d="M13 31 6 23q-5-4-5 2 0 3 4 9l9 14q3 5 10 4l9-2q5-1 6-8l2-17q0-5-4-5-2 0-3 3v-4q-1-5-5-4l-2 3-1-4q-2-4-5-2l-2 3-3-11q-1-4-5-3-3 1-2 6z" fill="#fff9eb" stroke="#8b7560" stroke-width="1.9" stroke-linejoin="round"/></svg>
<script src="vendor/three.min.js"></script><script src="physics.js"></script><script src="art.js"></script><script src="toys.js"></script><script src="sound.js"></script><script src="finish.js"></script><script src="game.js"></script>
</body></html>
