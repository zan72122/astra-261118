<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#48352c"><title>ゆうびんきょくのスタンプ</title>
<style>
*{box-sizing:border-box}html,body,#world{margin:0;width:100%;height:100%;overflow:hidden;background:#bca987}body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100%;height:100%;touch-action:none}#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 54% 40%,transparent 42%,rgba(54,32,21,.12) 100%);box-shadow:inset 0 0 32px #7551350a}
#journey,#sound,#collection{position:absolute;z-index:2}#journey{left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));height:46px;display:flex;align-items:center;gap:6px;border:1px solid #fff2ccad;border-radius:25px;padding:5px 12px 5px 5px;background:linear-gradient(160deg,#fffae8f2,#ede1c9f2);box-shadow:0 3px 9px #45302433,inset 0 0 0 2px #fdf6e8}.station{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;color:#9a8c73}.station svg{width:21px;height:21px}.station.now{color:#fff4db;background:#a34837;box-shadow:inset 0 0 0 2px #a34837,inset 0 0 0 3px #d48b71,0 1px 3px #5c362740;width:35px;height:35px}.station.past{color:#875b43}i{display:block;width:8px;border-top:2px dotted #b8a58a}#sound{top:max(20px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));width:46px;height:46px;border:1px solid #fff5df;border-radius:50%;background:linear-gradient(145deg,#fff7e6,#e7d8bd);box-shadow:0 2px 9px #3e291f40,inset 0 0 0 3px #f5ecda,inset 0 0 0 4px #bcab87;display:grid;place-items:center;color:#725942;cursor:pointer}#sound svg{width:24px;height:24px}#sound .slash{display:none}#sound.off .waves{display:none}#sound.off .slash{display:block}
#collection{left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1.1deg);display:flex;gap:7px;padding:8px 15px 9px;filter:drop-shadow(0 3px 3px #34241f44);background-color:#f4ead3;background-image:linear-gradient(110deg,#fff9e770,#c6ae842f);border-radius:4px;mask:linear-gradient(#000 0 0) center/calc(100% - 8px) 100% no-repeat,radial-gradient(circle at 0 50%,transparent 2px,#000 2.6px) left/51% 8px repeat-y,radial-gradient(circle at 100% 50%,transparent 2px,#000 2.6px) right/51% 8px repeat-y}.mark{width:25px;height:28px;display:grid;place-items:center;color:#baaa8c;border:1px dashed #c1ae8d;box-shadow:inset 0 0 0 2px #fbf4e2;transition:color .35s,background .35s}.mark svg{width:20px;height:20px}.mark.full{background:#e9c6aa;color:#9c4a37;border-color:#aa684d}.mark.current{color:#a25340;border-color:#b8775f}
#hand{position:absolute;left:0;top:0;pointer-events:none;width:44px;height:55px;filter:drop-shadow(1px 3px 2px #53301f55);z-index:1;opacity:0}#bloom{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.07;background:radial-gradient(ellipse at 56% 10%,#ffefc9 0%,transparent 62%)}
@media(max-width:520px){#journey{left:14px;top:max(14px,env(safe-area-inset-top));gap:3px;height:42px}#sound{right:14px;top:max(14px,env(safe-area-inset-top));width:42px;height:42px}#collection{bottom:max(18px,env(safe-area-inset-bottom))}}
</style></head><body><main id="world"></main><div id="bloom"></div><div id="finish"></div>
