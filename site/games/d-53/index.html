<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#273a43"><title>霜の窓をなぞる</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#9aafb6;-webkit-user-select:none;user-select:none}main{position:relative;isolation:isolate}#world{display:block;width:100%;height:100%;touch-action:none}
#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 52% 43%,transparent 48%,rgba(22,34,42,.13) 100%);box-shadow:inset 0 0 30px #293d4512}
.controls{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));display:flex;gap:9px}
button{display:grid;place-items:center;border:1px solid #fbf7e78a;border-radius:50%;width:39px;height:39px;color:#f9f8ef;background:linear-gradient(135deg,#687877a8,#445758ab);box-shadow:0 2px 7px #27323728,inset 0 0 0 3px #ced7ca13;backdrop-filter:blur(8px);touch-action:manipulation;cursor:pointer;padding:9px}
svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid #fff1b9;outline-offset:3px}button[aria-pressed=true] .waves,button:not([aria-pressed=true]) .mute{display:none}
.trail{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);height:42px;display:flex;align-items:center;gap:8px;padding:0 15px;border:1px solid #cdd7ca50;border-radius:24px;background:linear-gradient(#364648b8,#273838c7);box-shadow:0 3px 10px #17262a2a,inset 0 1px 0 #f9ffe313;backdrop-filter:blur(9px);pointer-events:none}
.trail i{width:3px;height:3px;border-radius:50%;background:#e5e7d78c}.trail span{width:23px;height:24px;color:#d9e1d3;opacity:.44;transition:color 1s,opacity 1s;display:grid;place-items:center}.trail span.on{color:#fff0c6;opacity:1;filter:drop-shadow(0 0 4px #ffefa843)}.trail span.done{opacity:.85}.trail svg{width:20px;height:20px}
#hint{position:absolute;top:0;left:0;width:60px;height:66px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px #24435466);will-change:transform,opacity}#hint path{stroke:#faf8e8;stroke-width:1.5;fill:#91aeb65c}#hint circle{stroke:#fff8e8;fill:none;stroke-width:1.2}
@media(max-width:520px){.controls{top:max(14px,env(safe-area-inset-top));right:13px;gap:7px}button{width:35px;height:35px;padding:8px}.trail{bottom:max(17px,env(safe-area-inset-bottom));height:38px;gap:6px;padding:0 13px}}
</style></head><body><main><canvas id="world" aria-label="霜の窓と冬の庭"></canvas><div id="finish"></div>
<div class="controls"><button id="sound" aria-label="音の切り替え" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><g class="waves"><path d="M16 8q4 4 0 8m3-11q7 7 0 14"/></g><path class="mute" d="m17 9 5 6m0-6-5 6"/></svg></button><button id="full" aria-label="全画面の切り替え"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></div>
<div class="trail" aria-hidden="true"><span class="on"><svg viewBox="0 0 24 24"><path d="M12 2v20M3.4 7l17.2 10M3.4 17l17.2-10M9 4l3 3 3-3M9 20l3-3 3 3M4.2 10.4l4-1.1-1-4M16.7 18.7l-1-4 4.1-1M4.2 13.6l4 1.1-1 4M16.7 5.3l-1 4 4.1 1"/></svg></span><i></i><span><svg viewBox="0 0 24 24"><path d="M4 21h16M6 20V4l11-2v19l-11-2m11-15h2v17m-5-9v2"/></svg></span><i></i><span><svg viewBox="0 0 24 24"><path d="M3 21h18M8 20Q7 13 3 9q6 3 8 10M12 20q-1-11 4-17-1 8-1 13m0 5q1-8 6-11-3 5-3 10"/></svg></span><i></i><span><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="4"/><path d="M12 2v2m0 14v2M3 11h2m14 0h2M5.5 4.5 7 6m10 10 1.5 1.5m0-13L17 6M7 16l-1.5 1.5"/></svg></span></div>
<svg id="hint" viewBox="0 0 60 66" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M11 10q2-2 4 1l10 14-2-5q0-4 4-2l4 5q-2-7 3-5l5 5q0-5 4-2l6 9q4 8 0 14l-6 6q-4 4-10 0L17 38q-4-4 0-6 2-1 8 3L10 15q-2-3 1-5z"/></svg>
