<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#343b34"><title>くつをみがいてあるく</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#343b34;overscroll-behavior:none}body{touch-action:none;user-select:none;-webkit-user-select:none}#world{width:100%;height:100%;display:block;touch-action:none}#shade,#fade,#grain{position:fixed;inset:0;pointer-events:none}#shade{background:radial-gradient(ellipse at 50% 45%,transparent 46%,rgba(34,24,16,.17) 100%)}#grain{opacity:.036;mix-blend-mode:soft-light}#fade{background:#34362f;opacity:0}
button{border:0;outline-offset:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}#sound{position:fixed;top:max(20px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(42,53,46,.86);color:#f1dfb3;border:1px solid #d7bd87;box-shadow:0 2px 9px #201f182f,inset 0 0 0 3px #4c5348}#sound svg{width:24px;height:24px}.muted .wave{display:none}#sound:not(.muted) .cross{display:none}
#chapters{position:fixed;bottom:max(21px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:35px;padding:5px 12px;display:flex;gap:15px;align-items:center;background:rgba(43,55,47,.93);border:1px solid #baa77c;box-shadow:0 3px 13px #211d1c40,inset 0 0 0 3px #475044;pointer-events:none}#chapters span{color:#b1b4a0;width:34px;height:34px;display:grid;place-items:center;position:relative}#chapters span+span:before{content:"";position:absolute;width:7px;height:1px;background:#8e9079;left:-11px}#chapters svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.45;stroke-linejoin:round;stroke-linecap:round;fill:none}#chapters .current{background:#e5d2a4;color:#444d41;box-shadow:0 0 0 1px #b2a174,inset 0 0 0 2px #c8b993;border-radius:50%}
#hint{position:fixed;top:0;left:0;width:43px;height:53px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 4px #49381c55);will-change:transform}#hint path{fill:#fff3d7;stroke:#786a51;stroke-linejoin:round;stroke-width:1.5}
@media(max-width:500px){#sound{left:14px;top:max(15px,env(safe-area-inset-top))}#chapters{bottom:max(19px,env(safe-area-inset-bottom))}}
</style></head><body>
