<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c9d9dc">
<title>氷の池でスケート</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,main{width:100%;height:100%;margin:0;overflow:hidden;background:#c8dadf}body{user-select:none;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}main{position:relative}#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 51%,rgba(38,57,67,.125) 100%)}button{position:absolute;right:max(21px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));border:1px solid #fff9;background:#eef2ed59;backdrop-filter:blur(10px);border-radius:50%;width:43px;height:43px;display:grid;place-items:center;color:#45565d;cursor:pointer;box-shadow:0 2px 9px #42525812}svg{overflow:visible}button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#muteSlash{display:none}button[aria-pressed=true] #muteSlash{display:block}button[aria-pressed=true] .wave{display:none}
#journey{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:100px;background:linear-gradient(135deg,#edf4f1ad,#e2edf0a8);border:1px solid #ffffffa1;box-shadow:0 3px 16px #38525d1c;backdrop-filter:blur(10px);pointer-events:none}
.stop{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;color:#586e77;opacity:.7;transition:background .8s,opacity .8s}.stop.on{background:#fff4d9;box-shadow:0 0 0 1px #bc995e7d,0 1px 4px #6d777a26;color:#927144;opacity:1}.stop svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.dot{width:3px;height:3px;border-radius:50%;background:#738b8b88}
#finger{position:absolute;top:0;left:0;width:37px;height:43px;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 3px #52646b70)}#morning{position:absolute;inset:0;pointer-events:none;background:#f1e8d4;opacity:0}
@media(min-width:800px){#journey{bottom:24px;gap:12px;padding:7px 15px}button{right:28px;top:25px}}
</style>
</head>
<body><main><canvas id="pond" aria-label="氷の池でスケート"></canvas><div id="finish"></div>
<div id="journey" aria-hidden="true">
<span class="stop on"><svg viewBox="0 0 24 24"><path d="M6 4h5l.7 5.1 4.4 2.4 2.1.3c1.6.3 2 2.1.3 2.6H5.3l.5-5.2zM7.4 15v3.3m7-3.3v3.3M3 17.7q.5 1.6 2.4 1.6h12.1q2.8 0 3.4-2.6M10 8l2-.5M11.5 10l1.8-.5"/></svg></span><i class="dot"></i>
<span class="stop"><svg viewBox="0 0 24 24"><path d="M2.4 18v-5q9.6-8 19.2 0v5h-3.3c-.3-6.6-12.3-6.6-12.6 0zM3 12V7.6m18 4.4V7.6M7.5 9.5V5.2m9 4.3V5.2M3 8q9-6 18 0"/></svg></span><i class="dot"></i>
<span class="stop"><svg viewBox="0 0 24 24"><path d="M12 2v20M3.4 7l17.2 10M3.4 17 20.6 7M9 4.4 12 7l3-2.6m-6 15.2 3-2.6 3 2.6M4 10.8l3.6-1.4-.5-3.6m9.8 12.4-.5-3.6 3.6-1.4M4 13.2l3.6 1.4-.5 3.6m9.8-12.4-.5 3.6 3.6 1.4"/></svg></span><i class="dot"></i>
<span class="stop"><svg viewBox="0 0 24 24"><path d="m5.5 8 6.5-5 6.5 5zM7 9l1 10h8l1-10M6.5 20.5h11M10.2 3.8V3a1.8 1.8 0 0 1 3.6 0v.8M12 12q-3 3.6 0 4.4 2.3-.6 0-4.4z"/></svg></span>
</div>
<button id="sound" aria-label="音の切り替え" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.4a5.2 5.2 0 0 1 0 7.2m2.8-10a9 9 0 0 1 0 12.8"/><path id="muteSlash" d="m17 10 5 5m0-5-5 5"/></svg></button>
<svg id="finger" viewBox="0 0 40 48" aria-hidden="true"><g transform="rotate(-20 16 16)"><path d="M12 29V9c0-4.5 6.5-4.5 6.5 0v14-5c0-3.7 5.8-3.7 5.8 0v5-3c0-3.3 5.4-3.3 5.4 0v4-1c0-3.2 5.1-2.7 5.1.6v9.2c0 7-3.8 10.1-9.2 10.1h-3.7c-5.2 0-8-2.6-11.6-8.2l-5-7.1c-2.3-3.5 2.2-7 4.8-4z" fill="#fff8e9" stroke="#9b8871" stroke-width="1.4"/></g></svg>
<div id="morning"></div></main>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="models.js"></script><script src="landscape.js"></script><script src="audio.js"></script><script src="game.js"></script>
</body></html>
