<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#c4d2c6">
<title>ふうしゃのミニゴルフ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,main{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#c7d5c8;color:#463d2d;touch-action:none;user-select:none;-webkit-user-select:none}
main{position:relative;isolation:isolate;height:100dvh}canvas#garden{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:2}
#stages{left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));display:flex;align-items:center;gap:5px;padding:5px 9px 5px 5px;border-radius:32px;background:#fffaeae8;box-shadow:0 3px 13px #302b2c22,inset 0 0 0 1px #fffcf3;pointer-events:none}
.stage{width:34px;height:34px;display:grid;place-items:center;color:#9a9a81;border-radius:50%;transition:background 1s,color 1s}
.stage svg{width:24px;height:24px}.stage.on{background:#aa503c;color:#fff6dd;box-shadow:inset 0 0 0 1px #903f3040}.stage.done{color:#577057}.dot{width:3px;height:3px;border-radius:50%;background:#b4ad96}
#sound{padding:0;right:max(22px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));width:44px;height:44px;border:none;border-radius:50%;display:grid;place-items:center;background:#fffaeae8;color:#50614e;box-shadow:0 3px 13px #302b2c22,inset 0 0 0 1px #fffcf3;cursor:pointer}
#sound svg{width:23px;height:23px}.mute .wave,#sound:not(.mute) .off{display:none}
#pressure{pointer-events:none;left:50%;bottom:max(21px,env(safe-area-inset-bottom));transform:translateX(-50%);height:41px;min-width:137px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 17px 0 12px;color:#fff8de;background:#283d32da;border:1px solid #f5eecc70;box-shadow:0 3px 9px #23352822;transition:opacity .5s}
#pressure svg{width:21px;height:25px;margin-right:7px}
.bar{width:6px;background:#e5e3ba52;border-radius:5px;align-self:center}.bar.lit{background:#f6d78f}.bar:first-of-type{background:#f2e7b8}
#hand{pointer-events:none;z-index:3;left:0;top:0;width:45px;height:54px;opacity:0;filter:drop-shadow(0 3px 3px #2331244d);will-change:transform}
#hand path{fill:#fffae7;stroke:#807457;stroke-width:1.5}
@media(max-width:520px){#stages{top:max(16px,env(safe-area-inset-top));left:14px}.stage{width:30px;height:30px}.stage svg{width:21px;height:21px}#sound{width:41px;height:41px;right:14px;top:max(16px,env(safe-area-inset-top))}#pressure{bottom:max(24px,env(safe-area-inset-bottom))}}
</style>
</head>
<body><main>
<canvas id="garden" aria-label="風車の庭のミニゴルフ"></canvas>
<div class="hud" id="stages" aria-label="ホールの進み具合">
<span class="stage on"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="m13 16-3 13h13l-3-13m-5 12v-5h3v5"/><path d="m16 13-8-6 2-3 6 8 6-9 3 2-8 8 9 6-2 3-8-8-6 9-3-2z" fill="currentColor" stroke-width=".8"/><circle cx="16" cy="13" r="2.1" fill="currentColor"/></svg></span><i class="dot"></i>
<span class="stage"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 20q13-12 26 0M4 13q12-9 24 0M5 10v12m7-14v8m8-8v8m7-6v12M3 26q3 2 6 0t6 0 6 0 7 0"/></svg></span><i class="dot"></i>
<span class="stage"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M4 26v-7a12 12 0 0 1 24 0v7h-6v-7a6 6 0 0 0-12 0v7zM5 15l5 2m-1-8 4 5m5-7-1 6m8-2-5 4m7 5-5 1"/></svg></span>
</div>
<button class="hud" id="sound" aria-label="音を切る" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h5l7-6v20l-7-6H5z" fill="currentColor" stroke-width="1.3"/><path class="wave" d="M21 11q5 5 0 10m4-14q8 9 0 18"/><path class="off" d="m21 12 7 8m0-8-7 8"/></svg></button>
<div class="hud" id="pressure" aria-hidden="true"><svg viewBox="0 0 26 31" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M7 5q0-4 4-4t4 4M8 18V7q0-3 3-2 1 0 1 2v8-3q2-3 4 0 3-2 4 1 3-1 3 3v5q0 7-6 8h-3q-4-1-7-6l-4-6q-1-3 2-3z"/></svg></div>
<svg id="hand" class="hud" viewBox="0 0 43 53" aria-hidden="true"><path d="M8 28 6 8q-.5-5 3-5 3-1 4 4l3 15-1-6q1-5 5-3l3 7-1-5q3-3 6 1l2 6q3-5 6 0l3 10q1 5-1 10l-2 6-14 3-4-6L5 35q-5-5-2-8 2-2 5 1Z"/></svg>
</main>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="world.js"></script><script src="audio.js"></script><script src="play.js"></script>
</body></html>
