<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#36382d">
<title>かんなで木をけずる</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#574832;overscroll-behavior:none}#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#finish{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 44%,transparent 50%,rgba(45,29,16,.13) 100%);mix-blend-mode:multiply}
.chrome{color:#f5e7c4;background:linear-gradient(150deg,rgba(69,66,48,.93),rgba(42,45,34,.95));box-shadow:inset 0 0 0 1px #f0d7a66b,0 3px 12px #20171038;backdrop-filter:blur(10px)}
#sound{position:fixed;right:max(23px,env(safe-area-inset-right));top:max(21px,env(safe-area-inset-top));height:46px;width:46px;padding:11px;border:1px solid #3b3c2a88;border-radius:50%;cursor:pointer}
#sound svg,.step svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round}
#sound .mute{display:none}#sound[aria-pressed="false"] .waves{display:none}#sound[aria-pressed="false"] .mute{display:block}
#journey{position:fixed;bottom:max(23px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:36px;pointer-events:none;border:1px solid #322e237a}
.step{height:36px;width:36px;padding:7px;color:#c8c5ac;transition:color .6s,background .6s;border-radius:50%}
.step.live{background:#ebdfbe;color:#474b36;box-shadow:0 1px 4px #20180d44,inset 0 0 0 2px #fff2}
.join{width:11px;height:1px;background:#d4c7a56b}
#hand{position:fixed;top:0;left:0;width:38px;height:48px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px #372a2044);will-change:transform,opacity}
@media(max-width:550px){#journey{bottom:max(27px,env(safe-area-inset-bottom))}#sound{right:16px;top:max(16px,env(safe-area-inset-top));width:42px;height:42px}}
</style></head>
<body>
<canvas id="view" aria-label="山の木工房"></canvas><div id="finish"></div>
<button class="chrome" id="sound" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="waves" d="M15.5 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="mute" d="m16 9 5 6m0-6-5 6"/></svg></button>
<div class="chrome" id="journey" aria-hidden="true">
<div class="step live"><svg viewBox="0 0 24 24"><path d="m2 14 13-2 7 2-3 4-14 1zM3 14l3 3 14-2M9 12l-2-6 4-1 3 7"/></svg></div><i class="join"></i>
<div class="step"><svg viewBox="0 0 24 24"><path d="m2 9 14-3 6 3-15 4zM4 11v7l2 1 1-6m11-3v6l2-1v-5M9 13v6m-3-3 12-3"/></svg></div><i class="join"></i>
<div class="step"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></div><i class="join"></i>
<div class="step"><svg viewBox="0 0 24 24"><path d="M6 14a4 4 0 0 1-.2-8 6 6 0 0 1 11.4 1A3.6 3.6 0 0 1 18 14H6Zm1 3-1 2m6-2-1 3m6-3-1 2"/></svg></div></div>
<svg id="hand" viewBox="0 0 40 50" aria-hidden="true"><path d="M11 25 8 12c-.7-4 4.9-5.3 6-1.8l3.5 10.2-.7-3.4c-.5-3.7 4.1-4.8 5.4-1.3l1.2 3.1c-1-4.3 3.9-5.4 5.3-1.7l.9 2.4c-.2-3.4 4-3.3 5.1-.2 2.6 7.5 2.8 10-.1 17.8l-1.1 5.3-15.2 2.3-4.5-5.3-9-8.1c-3.1-2.9.2-6.5 3.3-4.5l5 3.1z" fill="#fff4d8" stroke="#775e3a" stroke-width="1.4"/></svg>
<script src="vendor/three.min.js"></script><script src="physics.js"></script><script src="materials.js"></script><script src="world.js"></script><script src="audio.js"></script><script src="game.js"></script>
</body></html>
