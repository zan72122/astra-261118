<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#324a3b">
<title>いちごに おふとん</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#716550;overscroll-behavior:none}canvas#kitchen{display:block;width:100%;height:100%;touch-action:none;user-select:none;outline:0}#sound{position:fixed;right:max(22px,env(safe-area-inset-right));top:max(21px,env(safe-area-inset-top));width:46px;height:46px;padding:10px;border:1px solid #fcf5d8;border-radius:50%;background:#f5eddc;color:#304c40;box-shadow:0 2px 7px #38281c45,inset 0 0 0 3px #e5d9bc,inset 0 0 0 4px #f8f1e3;touch-action:manipulation;cursor:pointer}#sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#sound .off,#sound[aria-pressed="true"] .on{display:none}#sound[aria-pressed="true"] .off{display:block}#sound:active{transform:translateY(1px)}@media(max-width:500px){#sound{right:16px;top:max(16px,env(safe-area-inset-top));width:42px;height:42px}}
</style>
</head>
<body>
<canvas id="kitchen" aria-label="温かい求肥を指でのばすお菓子づくり"></canvas>
<button id="sound" aria-label="消音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4v14l-5-4h-4z" fill="currentColor" stroke-width="1.2"/><g class="on"><path d="M16 8.1c2.3 2.1 2.3 5.7 0 7.8m3-10.6c4.1 3.7 4.1 9.7 0 13.4"/></g><path class="off" d="m16.5 9 5 6m0-6-5 6"/></svg></button>
<script src="vendor/three.min.js"></script><script src="model.js"></script><script src="studio.js"></script><script src="kitchen.js"></script><script src="food.js"></script><script src="play.js"></script>
</body></html>
