<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b59d82"><title>電車で田んぼから海へ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d5b69a;touch-action:none;overscroll-behavior:none}#view{position:absolute;inset:0;width:100%;height:100%;display:block;outline:0}
#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 51% 45%,transparent 42%,rgba(50,33,27,.13) 100%);z-index:1}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.041;mix-blend-mode:soft-light}
#sound{position:absolute;top:max(20px,env(safe-area-inset-top));right:max(21px,env(safe-area-inset-right));border:1px solid #ffebcb70;border-radius:50%;width:43px;height:43px;background:#3e443f79;color:#fff1d4;box-shadow:inset 0 0 0 3px #ffffff0e,0 2px 10px #382c2525;display:grid;place-items:center;cursor:pointer;z-index:3}
#sound svg{width:22px;height:22px}#sound.muted .waves{display:none}#sound .slash{display:none}#sound.muted .slash{display:block}
#itinerary{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(378px,77vw);height:auto;pointer-events:none;filter:drop-shadow(0 4px 6px #2d251e49);z-index:2}
#hand{position:absolute;top:0;left:0;width:41px;height:47px;pointer-events:none;z-index:2;transform-origin:15% 8%;filter:drop-shadow(0px 2px 3px #36201770);opacity:0}
#mist{position:absolute;inset:0;pointer-events:none;background:#f8e5c4;opacity:0;z-index:4}
@media (max-width:600px){#itinerary{bottom:max(24px,env(safe-area-inset-bottom));width:86vw}#sound{top:max(17px,env(safe-area-inset-top));right:16px}}
</style></head>
<body>
<canvas id="view" aria-label="田んぼから海へ走る電車"></canvas><div id="finish"></div><div id="grain"></div>
<button id="sound" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke-width=".6"/><g class="waves"><path d="M16 8.3q3.6 3.7 0 7.4M18.8 5.5q6 6.5 0 13"/></g><path class="slash" d="m16 9 5 6m0-6-5 6"/></svg></button>
<canvas id="itinerary" width="756" height="126" aria-label="駅、鉄橋、トンネル、町、海辺を結ぶ路線図"></canvas>
<svg id="hand" viewBox="0 0 38 47"><path d="M8 24 3 10C1 4 7 2 9 7l6 13-1-5c-.5-4 4-6 6-2 2-4 6-3 7 1 4-2 7 1 7 4l1 9c0 6-4 11-4 14l-13 3c-2-6-9-8-13-14-2-4 0-7 3-6z" fill="#fff3d9" stroke="#705e4b" stroke-width="1.7" stroke-linejoin="round"/></svg>
<div id="mist"></div>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="world.js"></script><script src="scenery.js"></script><script src="game.js"></script>
</body></html>
