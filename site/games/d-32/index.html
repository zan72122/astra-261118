<html lang="ja">
<head>

<meta charset="utf-8">

<meta name="theme-color" content="#e9efec">
<title>ごみ収集車で町の朝</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,main{width:100%;height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}body{background:#d7e5e5}#scene{display:block;width:100%;height:100%;outline:none}
#route,#sound{position:absolute;top:max(23px,env(safe-area-inset-top));border:1px solid #fffc;background:#faf9f0f2;box-shadow:0 3px 12px #24392c26,0 1px 2px #24392c22}
#route{left:max(24px,env(safe-area-inset-left));display:flex;align-items:center;padding:6px 9px 6px 6px;border-radius:32px;gap:5px;pointer-events:none}
.stop{width:35px;height:35px;display:grid;place-items:center;color:#858b78;border-radius:50%;transition:background .55s,color .55s}
.stop svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.stop.active{color:#fffdec;background:#407653}.stop.done{color:#4c7759}.track{width:9px;height:2px;background:#b8bdac;border-radius:1px}
#sound{right:max(24px,env(safe-area-inset-right));width:47px;height:47px;display:grid;place-items:center;padding:10px;border-radius:50%;color:#455744;cursor:pointer}#sound svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}#sound .silent,#sound.muted .waves{display:none}#sound.muted .silent{display:inline}
#finger{position:absolute;left:0;top:0;width:44px;height:54px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px #32423050);will-change:transform,opacity}
@media(max-width:550px){#route{left:max(14px,env(safe-area-inset-left));gap:2px;padding:4px 6px 4px 4px}#route,#sound{top:max(15px,env(safe-area-inset-top))}.stop{width:30px;height:30px}.stop svg{width:19px;height:19px}.track{width:6px}#sound{right:14px;width:39px;height:39px;padding:7px}}
</style>
</head><body><main>
<canvas id="scene" aria-label="朝の町を走る緑のごみ収集車"></canvas>
<div id="route" aria-hidden="true">
<div class="stop active"><svg viewBox="0 0 24 24"><path d="m2.5 11 9.5-7.7 9.5 7.7M5.5 9.5v10h13v-10M10 19.5v-6h4v6"/></svg></div><i class="track"></i>
<div class="stop"><svg viewBox="0 0 24 24"><path d="M2 14h20M5 7v12m14-12v12M5 8q7 9 14 0M8.5 11v3m7-3v3M2 21q3-2 5 0 3-2 5 0 3-2 5 0 3-2 5 0"/></svg></div><i class="track"></i>
<div class="stop"><svg viewBox="0 0 24 24"><path d="M3 20V10l6 3v-4l6 3 1-8h3l1 16zM7 16h1m4 0h1m4 0h1"/></svg></div><i class="track"></i>
