<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e0d0b5">
<title>本を棚にもどす</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d4c4a7;touch-action:none;overscroll-behavior:none}#world{display:block;width:100%;height:100%;height:100dvh;touch-action:none}svg{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.icons{position:absolute;width:0;height:0;overflow:hidden}.hud{position:fixed;left:max(23px,env(safe-area-inset-left));top:max(23px,env(safe-area-inset-top));display:flex;align-items:center;padding:5px 10px 5px 5px;gap:4px;border-radius:28px;background:rgba(248,242,224,.91);box-shadow:inset 0 0 0 1px #fff9,0 3px 16px #382c1629;color:#817c65;pointer-events:none}.seal{width:31px;height:31px;display:grid;place-items:center;border-radius:100%;transition:background 1s,color 1s}.seal svg{width:20px;height:20px}.seal.on{color:#f3deb0;background:#394c40;box-shadow:inset 0 0 0 2px #394c40,inset 0 0 0 2.7px #adac87}.thread{width:8px;height:1px;background:#ac997477}button{position:fixed;right:max(23px,env(safe-area-inset-right));top:max(23px,env(safe-area-inset-top));width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #fff9;color:#4b5544;background:#f6f0dfed;box-shadow:0 3px 16px #382c1629;cursor:pointer}button svg{width:23px;height:23px}button .muted{display:none}button.off .muted{display:block}button.off .ring{display:none}#finger{pointer-events:none;position:fixed;top:0;left:0;width:43px;height:52px;opacity:0;filter:drop-shadow(0 2px 3px #4b352e55);will-change:transform,opacity}#finger path{fill:#fff6dc;stroke:#7a6749;stroke-width:1.3}#finger circle{stroke:#ffedb3;stroke-width:1.6}
@media(max-width:550px){.hud{left:14px;top:max(16px,env(safe-area-inset-top));gap:2px}.seal{width:27px;height:27px}.seal svg{width:17px;height:17px}.thread{width:5px}button{right:14px;top:max(16px,env(safe-area-inset-top));width:38px;height:38px}}
</style>
</head>
<body>
<canvas id="world" aria-label="本を棚にもどす"></canvas>
<svg class="icons" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5c3-1 6.5-.5 9 1.4C14.5 4.5 18 4 21 5v13c-3-1-6-.4-9 1.5-3-1.9-6-2.5-9-1.5zM12 6.4v13M5.5 8c1.3-.1 2.4.1 3.7.7m5.6 0c1.3-.6 2.5-.8 3.7-.7"/></symbol>
<symbol id="i-door" viewBox="0 0 24 24"><path d="M4 20h16M6 19V9a6 6 0 0 1 12 0v10M9 19V9a3 3 0 0 1 6 0v10"/><path d="M13 13h.2"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 18C3 9 11 5 20 4c-1 8-2 16-12 15M4 21 16 9m-6 6 5-.5M12 13l-.2-4"/></symbol>
</defs></svg>
<div class="hud" aria-hidden="true"><i class="seal on"><svg><use href="#i-book"/></svg></i><b class="thread"></b><i class="seal"><svg><use href="#i-door"/></svg></i><b class="thread"></b><i class="seal"><svg><use href="#i-sun"/></svg></i><b class="thread"></b><i class="seal"><svg><use href="#i-leaf"/></svg></i></div>
<button id="sound" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3.5 9h4L13 4.7v14.6L7.5 15h-4z"/><path class="ring" d="M16 8a6 6 0 0 1 0 8m2.5-10.3a9 9 0 0 1 0 12.6"/><path class="muted" d="m16 10 5 5m0-5-5 5"/></svg></button>
<svg id="finger" viewBox="0 0 43 52" aria-hidden="true"><circle cx="11.5" cy="10" r="8"/><path d="M15 29 9 13c-1.5-4 3.7-6.1 5.2-2.5l5.3 12.2-.9-3.3c-.7-3 3.6-4.4 5-1.4l1 2.7c-1-3 3.1-4.6 4.6-1.7l1.6 3c-.4-2.9 3.2-3.3 4.5-.9 3.5 6.4 5.1 11.5 2.3 17l-2 5-12 3.9c-4.7-4.7-9.7-6.7-14.5-12.3-2.3-2.7-.1-5.8 2.6-4.3l5.1 3.3z"/></svg>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="craft.js"></script><script src="room.js"></script><script src="sound.js"></script><script src="game.js"></script>
</body></html>
