<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#607a70"><title>あめだれのがっき</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#garden{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#b9cabe}#garden{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;outline:none}button{appearance:none;padding:0;cursor:pointer;touch-action:manipulation;color:inherit;border:0}button:focus-visible{outline:3px solid #ffdf9a;outline-offset:4px}
#finish{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 40%,transparent 48%,rgba(22,40,37,.14) 100%)}.corner{position:absolute;top:max(22px,env(safe-area-inset-top));height:43px;border:1px solid #fff9;box-shadow:0 2px 9px #122c2b24,inset 0 0 0 2px #e8ead752;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(244,244,223,.84);color:#405b51;display:flex;align-items:center;justify-content:center}#weather{left:max(23px,env(safe-area-inset-left));padding:0 14px;gap:10px;border-radius:22px}#weather svg{width:27px;height:26px}#meter{display:flex;gap:3px;height:15px;align-items:flex-end}#meter i{width:3px;border-radius:2px;background:#426154;opacity:.22}#audio{right:max(23px,env(safe-area-inset-right));width:43px;border-radius:50%}#audio svg{width:23px;height:23px}#audio.muted .soundarc{display:none}#audio:not(.muted) .mute{display:none}
#score{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);height:60px;display:flex;align-items:center;gap:6px;padding:5px 17px;border-radius:38px;background:linear-gradient(170deg,rgba(64,74,62,.91),rgba(33,50,44,.91));border:1px solid #c4bda5;box-shadow:0 4px 12px #17271d3b,inset 0 0 0 3px #d6d0b01c;backdrop-filter:blur(12px);pointer-events:none}#score:before,#score:after{content:'';width:3px;height:3px;border-radius:50%;background:#c7b996;box-shadow:0 1px 1px #101a18}.token{--fill:0deg;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;position:relative;color:#e0dfcf;background:conic-gradient(from 180deg,#f2db9a var(--fill),#b9bdab47 0)}.token:before{content:'';position:absolute;inset:1.5px;border-radius:100%;background:#4a574d}.token.live{box-shadow:0 0 0 2px #e1c68a9c;color:#fff2c9}.token.live:before{background:#68705a}.token svg{z-index:1;width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#hint{position:absolute;left:0;top:0;width:48px;height:54px;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px #263c3270);will-change:transform}#hint path{fill:#fff6df;stroke:#766c53;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.4}
@media(max-width:500px){.corner{top:max(17px,env(safe-area-inset-top))}#weather{left:15px}#audio{right:15px}#score{bottom:max(21px,env(safe-area-inset-bottom));height:53px;gap:6px;padding:5px 13px}.token{width:34px;height:34px}}
</style></head><body><main id="garden"><canvas id="view" aria-label="雨の縁側"></canvas><div id="finish"></div>
<button id="weather" class="corner" aria-label="雨の強さ"><svg viewBox="0 0 32 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 17a5 5 0 0 1-.2-10A7.1 7.1 0 0 1 21 6a5.6 5.6 0 1 1 2.1 11Z"/><path d="m9 21-1.4 3m8.4-4-2 5m9-4-1.4 3"/></svg><span id="meter"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i><i style="height:15px"></i></span></button>
<button id="audio" class="corner muted" aria-label="音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="soundarc" d="M16 8q4 4 0 8m3-11q6 7 0 14"/><path class="mute" d="m16.5 9 4.5 6m0-6-4.5 6"/></svg></button>
<div id="score" aria-hidden="true"></div>
<svg id="hint" viewBox="0 0 48 54" aria-hidden="true"><path d="M13 31 7 24c-3.1-4.2.8-7.4 4-4.2l5.3 5.5-2.7-18c-.7-5.3 5-6.1 5.9-1l2.3 12.3-.3-4.3c-.3-4.4 4.9-5 5.9-.9l.9 4.4c-.6-4.6 4.6-5.2 5.6-1l1 3.4c-.3-3.3 4-3.8 5.1-.6l1.8 8.7c.9 4.9-1.4 7.8-1.3 11.4l-17.1 4.8c-1.5-3.5-7.7-7.5-10.4-13.5Z"/></svg>
</main><script src="vendor/three.min.js"></script><script src="water.js"></script><script src="sound.js"></script><script src="craft.js"></script><script src="garden.js"></script><script src="play.js"></script></body></html>
