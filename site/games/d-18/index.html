<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#74b8d2">
<title>丘と海のジェットコースター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#84bad1;touch-action:none;user-select:none}#world{display:block;width:100%;height:100%;position:fixed;inset:0}button{font:inherit;touch-action:none;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:5px}
#finish{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 40%,rgba(28,36,40,.1) 100%)}
#sound,.route,.console{box-shadow:inset 0 1.5px 0 #fffbe6,0 2px 0 #676959,0 4px 8px #233e473d}
#sound{position:fixed;top:max(22px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));width:45px;height:45px;border:1px solid #9a9c87;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff7de,#e2dfc7);color:#315767}
#sound svg{width:23px;height:23px}#sound.mute .waves,#sound:not(.mute) .slash{display:none}
.route{position:fixed;right:max(24px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top));height:44px;display:flex;align-items:center;gap:11px;background:linear-gradient(#fff6dc,#e7e3ca);border-radius:24px;padding:4px 7px;border:1px solid #b9b8a1;pointer-events:none}
.seal{position:relative;width:32px;height:32px;border:1px solid #bac0ab;border-radius:50%;display:grid;place-items:center;color:#88958c;background:#e1e3cd;box-shadow:inset 0 1px 2px #7f897638}
.seal+.seal:before{content:"";position:absolute;background:#b2b69f;width:4px;height:4px;border-radius:50%;left:-9px}
.seal svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.seal.on{background:linear-gradient(140deg,#297c82,#225562);color:#fff6cb;border-color:#315d5e;box-shadow:0 0 0 2px #f4ca70}.seal.past{color:#3c7374}
.control-wrap{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:178px;height:83px;display:grid;place-items:center;pointer-events:none}
.console{width:170px;height:54px;position:absolute;border-radius:32px;border:2px solid #c2b793;background:linear-gradient(167deg,#f8efd4 4%,#ddd7bd 56%,#b7b59c);display:flex;align-items:center;justify-content:space-between;padding:0 11px}
.console:before,.console:after{content:"";width:6px;height:6px;border-radius:50%;border:1px solid #8f8c70;background:linear-gradient(135deg,#c4bc96 44%,#7c7d6c 46% 55%,#e9dcaf 58%);box-shadow:0 1px 0 #f4edd6}
.ridges{position:absolute;top:19px;width:14px;height:13px;background:repeating-linear-gradient(0deg,#a4a88e 0 1.5px,#eeead1 2px 3px,transparent 4px 5px);border-radius:4px}.ridges.l{left:25px}.ridges.r{right:25px}
.rim{width:87px;height:87px;position:absolute;border-radius:50%;background:linear-gradient(145deg,#fff0bc 3%,#dbb970 33%,#846f4c 59%,#ecd69c 86%);box-shadow:0 3px 4px #51554855,inset 0 0 0 1px #8b815e;display:grid;place-items:center}
#drive{pointer-events:auto;width:72px;height:72px;border-radius:50%;position:relative;border:3px solid #813b2e;background:radial-gradient(ellipse at 37% 23%,#ee8161 0%,#d45a40 51%,#b43f2e 82%);box-shadow:inset 0 2px 1px #ffc095,inset 0 -4px 3px #9e382a,0 0 0 2px #f6dfa0,0 2px 2px 3px #766d4c;display:grid;place-items:center;color:#fff1ce;transform:translateY(calc(-2px + var(--press,0)*4px));}
#drive svg{width:35px;height:37px;filter:drop-shadow(0 1px 1px #a3442c)}
#guide{position:absolute;left:99px;top:53px;width:39px;height:44px;opacity:0;filter:drop-shadow(1px 2px 2px #523e3877);transform-origin:30% 20%}
@media(max-width:600px){#sound{top:max(15px,env(safe-area-inset-top));left:15px;width:40px;height:40px}.route{top:max(15px,env(safe-area-inset-top));right:15px;height:39px;gap:8px}.seal{width:28px;height:28px}.seal+.seal:before{left:-7px;width:3px;height:3px}.seal svg{width:20px;height:20px}.control-wrap{bottom:max(21px,env(safe-area-inset-bottom));transform:translateX(-50%) scale(.94)}}
</style>
</head>
<body>
<canvas id="world" aria-label="海辺の木製ジェットコースター"></canvas><div id="finish"></div>
<button id="sound" aria-label="音を切り替える" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><g class="waves"><path d="M15.4 8a6 6 0 0 1 0 8M18.6 5a10 10 0 0 1 0 14"/></g><path class="slash" d="m16 9 5 6m0-6-5 6"/></svg></button>
<div class="route" aria-hidden="true">
<span class="seal on"><svg viewBox="0 0 26 26"><path d="m2 20 7-10 4 5 4-9 7 14z"/><path d="m14.5 11.5 2.6 1.4 1.7-2"/><circle cx="6" cy="6.7" r="1.7" fill="currentColor" stroke="none"/></svg></span>
<span class="seal"><svg viewBox="0 0 26 26"><path d="M2 14c3 0 4-3 6-3s3 3 6 3 3-3 6-3c2 0 2.5 1.5 4 2M2 19c3 0 4-3 6-3s3 3 6 3 3-3 6-3c2 0 2.5 1.5 4 2"/><path d="m5 8 4-4 4 4"/></svg></span>
<span class="seal"><svg viewBox="0 0 26 26"><circle cx="13" cy="11" r="8.3"/><path d="m10 23 3-12 3 12M8 23h10M13 3v8l7-4m-7 4 7 4m-7-4-7 4m7-4L6 7"/></svg></span>
<span class="seal"><svg viewBox="0 0 26 26"><path d="M2 17h22M6 21h14M7 16a6 6 0 0 1 12 0M13 3v3M3.2 8l2.4 2M22.8 8l-2.4 2"/></svg></span>
</div>
<div class="control-wrap"><div class="console"><i class="ridges l"></i><i class="ridges r"></i></div><div class="rim"><button id="drive" aria-label="押すと巻き上げ、離すと滑走"><svg viewBox="0 0 34 38" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 22V9.3a2 2 0 0 1 4 0V19 5.8a2.1 2.1 0 0 1 4.2 0v13-10a2 2 0 0 1 4.1 0v11.1-7.2a2.1 2.1 0 0 1 4.2 0v11c0 6.4-3.3 10.2-8.2 10.2-3.8 0-5.9-1.4-8.2-4.8L5 21.7c-1.7-2.5.9-4.9 3-3.1l2.3 3.4z" fill="currentColor"/></svg></button></div><svg id="guide" viewBox="0 0 39 45"><path d="m14 23-6-13C5 4 10 2 13 7l7 12-1-6c0-3 4-4 5 0l1 3c0-5 5-5 6-1 3-2 6 0 6 4l-1 11-5 9-10 3-9-8-8-6c-4-4-1-8 3-6l7 4z" fill="#fff2d4" stroke="#746a50" stroke-width="1.5"/></svg></div>
<script src="vendor/three.min.js"></script><script src="simulation.js"></script><script src="scenery.js"></script><script src="train.js"></script><script src="ride.js"></script>
</body></html>
