<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bbbd97"><title>コンバインで麦をかりとる</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,main{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#acbfbb;color:#f8efda;user-select:none;-webkit-user-select:none}
main{position:relative;isolation:isolate}#field{width:100%;height:100%;display:block;outline:0}
svg{display:block}#glyphs{position:absolute;width:0;height:0;overflow:hidden}
#badge,#sound,#trail{position:absolute;z-index:2}
#badge{left:calc(env(safe-area-inset-left) + 23px);top:calc(env(safe-area-inset-top) + 20px);display:flex;align-items:center;pointer-events:none;filter:drop-shadow(0 3px 5px #3b35262a)}
#crest{width:64px;height:69px;z-index:1}
#measure{margin-left:-9px;border-radius:0 24px 24px 0;padding:8px 12px 8px 14px;display:flex;gap:4px;background:linear-gradient(180deg,#fff9e5e8,#f5e9cbe8);border:1px solid #fff9e1cc;border-left:0;box-shadow:inset 0 -2px 0 #99875938}
#measure i{display:block;width:5px;height:13px;background:#d4cbb0;border:1px solid #958e713d;border-radius:4px 0 4px 0;transform:rotate(14deg);transition:background .25s}
#measure i.on{background:#c39742}
#sound{display:grid;place-items:center;right:calc(env(safe-area-inset-right) + 23px);top:calc(env(safe-area-inset-top) + 24px);width:46px;height:46px;border-radius:50%;color:#40594f;border:1px solid #fff6dccc;background:linear-gradient(145deg,#fff9e7f2,#eae3c9eb);box-shadow:0 2px 6px #383b3230,inset 0 0 0 3px #f2ebd6,inset 0 0 0 4px #8d977454;cursor:pointer}
#sound svg{width:23px;height:23px}#sound.off .waves,#sound:not(.off) .slash{display:none}
#trail{bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);height:52px;padding:4px 13px 4px 5px;display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#fff8e7f0,#eee5cde8);border:1px solid #fff7de;border-radius:30px;box-shadow:0 4px 16px #312b2530,inset 0 0 0 2px #e8e0c7;pointer-events:none}
#trail b{position:relative;display:grid;place-items:center;width:30px;height:37px;color:#777e66}
#trail b svg{width:27px;height:27px;stroke-width:1.65}
#trail b.active{background:linear-gradient(140deg,#475e4d,#2a453f);width:41px;height:41px;border-radius:50%;box-shadow:inset 0 0 0 2px #f5ecd5,inset 0 0 0 3px #8b997c;color:#efcc82}
#trail b.done{color:#8b7949}#trail span{width:10px;height:1px;background:#a7a58b;position:relative}
#trail span:after{content:'';position:absolute;width:3px;height:3px;background:#a7a58b;border-radius:50%;left:4px;top:-1px}
#hint{pointer-events:none;position:absolute;z-index:1;left:0;top:0;width:70px;height:75px;filter:drop-shadow(0 2px 4px #3939285c);opacity:0;will-change:transform}
@media(max-width:540px){#crest{width:52px;height:56px}#badge{left:15px;top:calc(env(safe-area-inset-top) + 15px)}#sound{right:16px;top:calc(env(safe-area-inset-top) + 18px);width:43px;height:43px}#trail{bottom:calc(env(safe-area-inset-bottom) + 22px);height:48px;gap:7px}#trail b.active{width:37px;height:37px}#measure{gap:3px;padding:6px 10px 6px 13px}#hint{width:59px;height:65px}}
</style>
</head>
<body><main>
<canvas id="field" aria-label="麦畑のコンバイン"></canvas>
<svg id="glyphs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="wheat" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 28C13 24 18 16 24 5"/><path d="M11 24q-6-1-6-8 7 1 7 7Zm3-5q-5-2-4-9 6 3 5 8Zm4-6q-3-4-1-9 5 4 2 8Zm-6 11q6 2 11-4-7-1-11 4Zm4-7q6 2 11-4-7-1-11 4Zm5-8q6 0 6-7-6 2-6 7Z" fill="currentColor" stroke-width=".7"/></g></symbol>
<symbol id="lorry" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"><path d="M3 9h16v13H3zM19 14h5l5 6v3h-3m-7 0h2M5 22H2m2-9h13M4 16h13M21 16v4h6"/><circle cx="8" cy="23.4" r="2.7"/><circle cx="23.3" cy="23.4" r="2.7"/></g></symbol>
<symbol id="bale" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round"><ellipse cx="11.3" cy="18" rx="7.3" ry="9"/><path d="M9 9.5 19 6c5-1.3 9 2.9 9 8.8 0 4.4-2.2 8-6 9.2l-9 2.8M17 8c5 .9 8 9 4.5 14.5M11 22c-4-1-4-8 .3-8.1 3.1.2 3.7 6.5.6 6.9-1.9 0-2.4-3.9-.7-3.9"/></g></symbol>
<symbol id="barn" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"><path d="M2 15 7 7l9-4 9 4 5 8M5 13v14h22V13M10 27V16h12v11m-12-11 12 11m0-11L10 27"/><path d="M14 8h4v4h-4z"/></g></symbol>
<symbol id="dawn" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 21h28M6 25h20M10 20a6 6 0 0 1 12 0M16 5v4m-9-1 2.5 3.5M3 14l3.5 1.6M25 8l-2.5 3.5M29 14l-3.5 1.6"/></g></symbol>
</defs></svg>
<div id="badge" aria-label="穀物タンク"><svg id="crest" viewBox="0 0 64 69" aria-hidden="true">
<path d="M32 2 54 8q5 2 5 7v22c0 13-13 23-27 29C18 61 5 51 5 37V15q0-5 5-7z" fill="#f4e8ca" stroke="#fff4da" stroke-width="1.4"/>
<path d="M32 6 52 12q3 1 3 5v20c0 11-10 19-23 25C19 56 9 48 9 37V17q0-4 3-5z" fill="#354f45"/>
<path d="M32 9 50 14q2 1 2 4v18c0 10-9 18-20 23C21 54 12 46 12 36V18q0-3 2-4z" fill="none" stroke="#aab18b" stroke-width=".85"/>
<g fill="#eac47d"><circle cx="32" cy="16" r="2"/><path d="M22 18h6v1h-6zm14 0h6v1h-6z"/></g>
<use href="#wheat" x="13" y="20" width="34" height="34" color="#efd196"/><path d="M19 48q5 5 11 7m-10-9q0-5-4-6 0 5 4 6" fill="none" stroke="#d5b67a" stroke-width="1.5"/>
</svg><div id="measure"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<button id="sound" aria-label="音を切り替える" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="currentColor" stroke-width="1"/><g class="waves"><path d="M15.5 8.7q3 3.2 0 6.6M18.2 5.8q5.4 6.2 0 12.4"/></g><path class="slash" d="m16 9 5 6m0-6-5 6"/></svg></button>
<div id="trail" aria-hidden="true"><b class="active"><svg><use href="#wheat"/></svg></b><span></span><b><svg><use href="#lorry"/></svg></b><span></span><b><svg><use href="#bale"/></svg></b><span></span><b><svg><use href="#barn"/></svg></b><span></span><b><svg><use href="#dawn"/></svg></b></div>
<svg id="hint" viewBox="0 0 70 75" aria-hidden="true"><ellipse id="touch-ring" cx="15" cy="13" rx="11" ry="8" fill="none" stroke="#fae7aa" stroke-width="2"/><path d="M28 48 12 18c-3-6 3-10 7-4l13 18-5-11c-2-5 3-8 6-4l7 12-3-9c-1-4 4-6 7-2l5 10-2-5c-1-4 4-6 7-1l7 17c3 7 2 14-2 19l-4 6-19 4-5-5-16-11c-5-4-2-10 3-8z" fill="#fff4d9" stroke="#6c7058" stroke-width="1.8" stroke-linejoin="round"/></svg>
</main>
<script src="vendor/three.min.js"></script><script src="sim.js"></script><script src="mesh.js"></script><script src="machines.js"></script><script src="land.js"></script><script src="crop.js"></script><script src="sky.js"></script><script src="sound.js"></script><script src="game.js"></script>
</body></html>
